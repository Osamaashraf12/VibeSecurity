<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1130" role="img" aria-label="VibeSecurity Hunter Agent Pipeline Diagram">
  <title>VibeSecurity Hunter Agent Pipeline (V2)</title>
  <desc>Premium dark-themed flow diagram detailing the LangGraph multi-agent orchestration pipeline.</desc>
  <defs>
    <!-- Import Google Font -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      
      text { 
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      }
      .bg {
        fill: #0B0F19;
      }
      .container-box {
        stroke: #1E293B;
        stroke-width: 1;
        fill: #111827;
        fill-opacity: 0.4;
      }
      .tt { 
        font-size: 14px; 
        font-weight: 600; 
        fill: #F8FAFC; 
        text-anchor: middle; 
        dominant-baseline: central; 
      }
      .ts { 
        font-size: 11px; 
        font-weight: 500;
        fill: #94A3B8; 
        text-anchor: middle; 
        dominant-baseline: central; 
      }
      .tm { 
        font-size: 10px; 
        font-weight: 600; 
        fill: #64748B; 
        text-anchor: middle;
        text-transform: uppercase; 
        letter-spacing: 0.08em;
      }
      .node-card {
        transition: transform 0.2s ease, filter 0.2s ease;
        cursor: pointer;
      }
      .node-card:hover {
        transform: translateY(-2px);
        filter: url(#glow);
      }
      .connector {
        stroke: #475569;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .connector-flow {
        stroke: #818CF8;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 6 6;
        animation: flow 30s linear infinite;
        fill: none;
      }
      @keyframes flow {
        to {
          stroke-dashoffset: -300;
        }
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="grad-slate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Card Background Gradients -->
    <linearGradient id="bg-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581C87" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#581C87" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="bg-emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="bg-indigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="bg-slate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Marker/Arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-active" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- START -->
  <g class="node-card">
    <rect x="315" y="25" width="90" height="36" rx="18" fill="url(#bg-slate)" stroke="url(#grad-slate)" stroke-width="1.25" />
    <text class="tt" x="360" y="43">START</text>
  </g>

  <!-- katana -->
  <g class="node-card">
    <rect x="205" y="85" width="310" height="50" rx="10" fill="url(#bg-emerald)" stroke="url(#grad-emerald)" stroke-width="1.5" />
    <text class="tt" x="360" y="103">katana</text>
    <text class="ts" x="360" y="121">web crawl · HTTP pair capture</text>
  </g>

  <text class="tm" x="360" y="160">Parallel Fork</text>

  <!-- Parallel Container 1 -->
  <g>
    <rect x="68" y="172" width="584" height="92" rx="12" class="container-box" stroke-dasharray="6 4" />
  </g>

  <!-- synthesizer -->
  <g class="node-card">
    <rect x="88" y="188" width="220" height="60" rx="10" fill="url(#bg-purple)" stroke="url(#grad-purple)" stroke-width="1.5" />
    <text class="tt" x="198" y="210">synthesizer</text>
    <text class="ts" x="198" y="230">LLM endpoint analysis</text>
  </g>

  <!-- cvinder -->
  <g class="node-card">
    <rect x="412" y="188" width="220" height="60" rx="10" fill="url(#bg-purple)" stroke="url(#grad-purple)" stroke-width="1.5" />
    <text class="tt" x="522" y="210">cvinder</text>
    <text class="ts" x="522" y="230">CVE lookup</text>
  </g>

  <!-- join -->
  <g class="node-card">
    <rect x="315" y="285" width="90" height="36" rx="18" fill="url(#bg-slate)" stroke="url(#grad-slate)" stroke-width="1.25" />
    <text class="tt" x="360" y="303">join</text>
  </g>

  <!-- threat_modeller -->
  <g class="node-card">
    <rect x="175" y="345" width="370" height="50" rx="10" fill="url(#bg-emerald)" stroke="url(#grad-emerald)" stroke-width="1.5" />
    <text class="tt" x="360" y="363">threat_modeller</text>
    <text class="ts" x="360" y="381">OWASP attack surface mapping</text>
  </g>

  <!-- coordinator_dispatch -->
  <g class="node-card">
    <rect x="155" y="420" width="410" height="50" rx="10" fill="url(#bg-emerald)" stroke="url(#grad-emerald)" stroke-width="1.5" />
    <text class="tt" x="360" y="438">coordinator_dispatch</text>
    <text class="ts" x="360" y="456">routes findings to specialists</text>
  </g>

  <text class="tm" x="360" y="495">Fan-out · Send()</text>

  <!-- Parallel Container 2: 6 specialists -->
  <g>
    <rect x="30" y="508" width="660" height="175" rx="12" class="container-box" stroke-dasharray="6 4" />
  </g>

  <!-- Specialist row 1 -->
  <g class="node-card">
    <rect x="52" y="525" width="180" height="60" rx="10" fill="url(#bg-indigo)" stroke="url(#grad-indigo)" stroke-width="1.5" />
    <text class="tt" x="142" y="547">auth</text>
    <text class="ts" x="142" y="567">sessions · JWT</text>
  </g>

  <g class="node-card">
    <rect x="270" y="525" width="180" height="60" rx="10" fill="url(#bg-indigo)" stroke="url(#grad-indigo)" stroke-width="1.5" />
    <text class="tt" x="360" y="547">injection</text>
    <text class="ts" x="360" y="567">SQLi · SSRF · SSTI</text>
  </g>

  <g class="node-card">
    <rect x="488" y="525" width="180" height="60" rx="10" fill="url(#bg-indigo)" stroke="url(#grad-indigo)" stroke-width="1.5" />
    <text class="tt" x="578" y="547">access_control</text>
    <text class="ts" x="578" y="567">IDOR · privesc</text>
  </g>

  <!-- Specialist row 2 -->
  <g class="node-card">
    <rect x="52" y="605" width="180" height="60" rx="10" fill="url(#bg-indigo)" stroke="url(#grad-indigo)" stroke-width="1.5" />
    <text class="tt" x="142" y="627">business_logic</text>
    <text class="ts" x="142" y="647">workflow abuse</text>
  </g>

  <g class="node-card">
    <rect x="270" y="605" width="180" height="60" rx="10" fill="url(#bg-indigo)" stroke="url(#grad-indigo)" stroke-width="1.5" />
    <text class="tt" x="360" y="627">client_side</text>
    <text class="ts" x="360" y="647">XSS · DOM · CORS</text>
  </g>

  <g class="node-card">
    <rect x="488" y="605" width="180" height="60" rx="10" fill="url(#bg-indigo)" stroke="url(#grad-indigo)" stroke-width="1.5" />
    <text class="tt" x="578" y="627">infrastructure</text>
    <text class="ts" x="578" y="647">misconfig · takeover</text>
  </g>

  <text class="tm" x="360" y="705">Fan-in</text>

  <!-- coordinator_checkpoint -->
  <g class="node-card">
    <rect x="155" y="715" width="410" height="50" rx="10" fill="url(#bg-emerald)" stroke="url(#grad-emerald)" stroke-width="1.5" />
    <text class="tt" x="360" y="733">coordinator_checkpoint</text>
    <text class="ts" x="360" y="751">collects all specialist findings</text>
  </g>

  <!-- chainer -->
  <g class="node-card">
    <rect x="205" y="785" width="310" height="50" rx="10" fill="url(#bg-purple)" stroke="url(#grad-purple)" stroke-width="1.5" />
    <text class="tt" x="360" y="803">chainer</text>
    <text class="ts" x="360" y="821">builds multi-step attack paths</text>
  </g>

  <!-- poc_generator -->
  <g class="node-card">
    <rect x="185" y="855" width="350" height="50" rx="10" fill="url(#bg-purple)" stroke="url(#grad-purple)" stroke-width="1.5" />
    <text class="tt" x="360" y="873">poc_generator</text>
    <text class="ts" x="360" y="891">generates proof-of-concept payloads</text>
  </g>

  <!-- revisor -->
  <g class="node-card">
    <rect x="215" y="925" width="290" height="50" rx="10" fill="url(#bg-slate)" stroke="url(#grad-slate)" stroke-width="1.25" />
    <text class="tt" x="360" y="943">revisor</text>
    <text class="ts" x="360" y="961">deduplicates · validates findings</text>
  </g>

  <!-- report_agent -->
  <g class="node-card">
    <rect x="185" y="995" width="350" height="50" rx="10" fill="url(#bg-purple)" stroke="url(#grad-purple)" stroke-width="1.5" />
    <text class="tt" x="360" y="1013">report_agent</text>
    <text class="ts" x="360" y="1031">compiles structured report</text>
  </g>

  <!-- END -->
  <g class="node-card">
    <rect x="315" y="1065" width="90" height="36" rx="18" fill="url(#bg-slate)" stroke="url(#grad-slate)" stroke-width="1.25" />
    <text class="tt" x="360" y="1083">END</text>
  </g>

  <!-- Adjust viewBox to 1130 for END -->
  <!-- Actually since viewBox is 1020, let's adjust the SVG's height to 1130 -->

  <!-- Arrows -->
  <line x1="360" y1="61"  x2="360" y2="85" class="connector-flow" marker-end="url(#arrow-active)" />
  <path d="M360 135 L360 166 L198 166 L198 188" class="connector" marker-end="url(#arrow)" />
  <path d="M360 135 L360 166 L522 166 L522 188" class="connector" marker-end="url(#arrow)" />
  <path d="M198 248 L198 266 L360 266 L360 285" class="connector" marker-end="url(#arrow)" />
  <path d="M522 248 L522 266 L360 266 L360 285" class="connector" marker-end="url(#arrow)" />
  <line x1="360" y1="321" x2="360" y2="345" class="connector-flow" marker-end="url(#arrow-active)" />
  <line x1="360" y1="395" x2="360" y2="420" class="connector-flow" marker-end="url(#arrow-active)" />
  <line x1="360" y1="470" x2="360" y2="508" class="connector-flow" marker-end="url(#arrow-active)" />
  <line x1="360" y1="683" x2="360" y2="715" class="connector-flow" marker-end="url(#arrow-active)" />
  <line x1="360" y1="765" x2="360" y2="785" class="connector-flow" marker-end="url(#arrow-active)" />
  <line x1="360" y1="835" x2="360" y2="855" class="connector-flow" marker-end="url(#arrow-active)" />
  <line x1="360" y1="905" x2="360" y2="925" class="connector-flow" marker-end="url(#arrow-active)" />
  <line x1="360" y1="975" x2="360" y2="995" class="connector-flow" marker-end="url(#arrow-active)" />
  <line x1="360" y1="1045" x2="360" y2="1065" class="connector" marker-end="url(#arrow)" />
</svg>
