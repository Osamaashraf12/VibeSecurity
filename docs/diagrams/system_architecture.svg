<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" role="img" aria-label="VibeSecurity System Architecture Diagram">
  <title>VibeSecurity System Architecture (V2)</title>
  <desc>Premium dark-themed architecture diagram showing the Kali Linux Docker container, FastAPI backend, Hunter Agent, and external services.</desc>
  <defs>
    <!-- Import Google Font -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      
      text { 
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      }
      .bg {
        fill: #0B0F19;
      }
      .container-box {
        stroke: #1E293B;
        stroke-width: 2;
        fill: #111827;
        fill-opacity: 0.6;
      }
      .tt { 
        font-size: 14px; 
        font-weight: 600; 
        fill: #F8FAFC; 
        text-anchor: middle; 
        dominant-baseline: central; 
      }
      .ts { 
        font-size: 11px; 
        font-weight: 500;
        fill: #94A3B8; 
        text-anchor: middle; 
        dominant-baseline: central; 
      }
      .tm { 
        font-size: 11px; 
        font-weight: 600; 
        fill: #64748B; 
        text-transform: uppercase; 
        letter-spacing: 0.1em;
      }
      .node-card {
        transition: transform 0.2s ease, filter 0.2s ease;
        cursor: pointer;
      }
      .node-card:hover {
        transform: translateY(-2px);
        filter: url(#glow);
      }
      .connector {
        stroke: #475569;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .connector-flow {
        stroke: #6366F1;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 6 6;
        animation: flow 30s linear infinite;
        fill: none;
      }
      @keyframes flow {
        to {
          stroke-dashoffset: -300;
        }
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-slate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Card Background Gradients -->
    <linearGradient id="bg-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="bg-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="bg-emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="bg-slate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Marker/Arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-active" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Docker / Kali Linux Container Group -->
  <g>
    <rect x="30" y="105" width="560" height="445" rx="16" class="container-box" />
    <rect x="30" y="105" width="560" height="445" rx="16" fill="none" stroke="url(#grad-slate)" stroke-width="1.5" stroke-dasharray="8 4" stroke-opacity="0.5" />
    <text class="tm" x="50" y="132">Docker Container · Kali Linux Base</text>
  </g>

  <!-- External: User Browser -->
  <g class="node-card">
    <rect x="278" y="25" width="180" height="50" rx="10" fill="url(#bg-amber)" stroke="url(#grad-amber)" stroke-width="1.5" />
    <text class="tt" x="368" y="50">User Browser</text>
  </g>

  <!-- External: OpenRouter -->
  <g class="node-card">
    <rect x="600" y="145" width="105" height="60" rx="10" fill="url(#bg-amber)" stroke="url(#grad-amber)" stroke-width="1.5" />
    <text class="tt" x="652" y="167">OpenRouter</text>
    <text class="ts" x="652" y="187">LLM Gateway</text>
  </g>

  <!-- Inside Container: Row 1 - Frontend -->
  <g class="node-card">
    <rect x="55" y="150" width="145" height="60" rx="10" fill="url(#bg-purple)" stroke="url(#grad-purple)" stroke-width="1.5" />
    <text class="tt" x="127" y="172">Web UI</text>
    <text class="ts" x="127" y="192">Vanilla HTML / JS</text>
  </g>

  <!-- Inside Container: Row 1 - FastAPI Backend -->
  <g class="node-card">
    <rect x="268" y="150" width="200" height="60" rx="10" fill="url(#bg-emerald)" stroke="url(#grad-emerald)" stroke-width="1.5" />
    <text class="tt" x="368" y="172">FastAPI Backend</text>
    <text class="ts" x="368" y="192">API Router Layer</text>
  </g>

  <!-- Inside Container: Row 2 - Hunter Agent -->
  <g class="node-card">
    <rect x="55" y="280" width="180" height="60" rx="10" fill="url(#bg-purple)" stroke="url(#grad-purple)" stroke-width="1.5" />
    <text class="tt" x="145" y="302">Hunter Agent</text>
    <text class="ts" x="145" y="322">LangGraph Pipeline</text>
  </g>

  <!-- Inside Container: Row 2 - Tool Wrappers -->
  <g class="node-card">
    <rect x="288" y="280" width="180" height="60" rx="10" fill="url(#bg-emerald)" stroke="url(#grad-emerald)" stroke-width="1.5" />
    <text class="tt" x="378" y="302">Tool Wrappers</text>
    <text class="ts" x="378" y="322">Recon &amp; Exploit Orchestration</text>
  </g>

  <!-- Inside Container: Row 3 - CLI Tools -->
  <g class="node-card">
    <rect x="55" y="415" width="220" height="60" rx="10" fill="url(#bg-slate)" stroke="url(#grad-slate)" stroke-width="1.25" />
    <text class="tt" x="165" y="437">CLI Security Tools</text>
    <text class="ts" x="165" y="457">subfinder · katana · nuclei</text>
  </g>

  <!-- Inside Container: Row 3 - File System -->
  <g class="node-card">
    <rect x="335" y="415" width="220" height="60" rx="10" fill="url(#bg-slate)" stroke="url(#grad-slate)" stroke-width="1.25" />
    <text class="tt" x="445" y="437">File System</text>
    <text class="ts" x="445" y="457">var/ · Scan Results</text>
  </g>

  <!-- Connections / Lines -->
  <!-- Browser to Backend (Active Flow) -->
  <path d="M368 75 L368 150" class="connector-flow" marker-end="url(#arrow-active)" />
  
  <!-- UI to Backend -->
  <path d="M200 180 L268 180" class="connector" marker-end="url(#arrow)" />
  
  <!-- Backend to OpenRouter -->
  <path d="M468 180 L600 180" class="connector" marker-end="url(#arrow)" />
  
  <!-- Backend dispatching tasks -->
  <path d="M368 210 L368 245 L145 245 L145 280" class="connector" marker-end="url(#arrow)" />
  <path d="M368 210 L368 245 L378 245 L378 280" class="connector" marker-end="url(#arrow)" />

  <!-- Tool Wrappers executing CLI tools -->
  <path d="M378 340 L378 375 L165 375 L165 415" class="connector" marker-end="url(#arrow)" />

  <!-- Tool Wrappers writing to File System -->
  <path d="M468 310 L490 310 L490 415" class="connector" marker-end="url(#arrow)" />

  <!-- Hunter Agent using CLI Tools & Writing Results -->
  <path d="M145 340 L145 390 L445 390 L445 415" class="connector" marker-end="url(#arrow)" />
</svg>
