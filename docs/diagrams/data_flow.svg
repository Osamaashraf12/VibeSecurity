<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" role="img" aria-label="VibeSecurity Data Flow Diagram">
  <title>VibeSecurity Data Flow (V2)</title>
  <desc>Premium dark-themed data flow diagram mapping data transit from User Input to Client Response.</desc>
  <defs>
    <!-- Import Google Font -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      
      text { 
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      }
      .bg {
        fill: #0B0F19;
      }
      .tt { 
        font-size: 14px; 
        font-weight: 600; 
        fill: #F8FAFC; 
        text-anchor: middle; 
        dominant-baseline: central; 
      }
      .ts { 
        font-size: 11px; 
        font-weight: 500;
        fill: #94A3B8; 
        text-anchor: middle; 
        dominant-baseline: central; 
      }
      .node-card {
        transition: transform 0.2s ease, filter 0.2s ease;
        cursor: pointer;
      }
      .node-card:hover {
        transform: translateY(-2px);
        filter: url(#glow);
      }
      .connector {
        stroke: #475569;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .connector-flow {
        stroke: #818CF8;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 6 6;
        animation: flow 30s linear infinite;
        fill: none;
      }
      @keyframes flow {
        to {
          stroke-dashoffset: -300;
        }
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="grad-slate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Card Background Gradients -->
    <linearGradient id="bg-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="bg-emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="bg-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581C87" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#581C87" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="bg-slate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Marker/Arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-active" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- User Input -->
  <g class="node-card">
    <rect x="238" y="25" width="244" height="56" rx="10" fill="url(#bg-amber)" stroke="url(#grad-amber)" stroke-width="1.5" />
    <text class="tt" x="360" y="48">User Input</text>
    <text class="ts" x="360" y="66">Target Domain &amp; Configuration</text>
  </g>

  <!-- FastAPI API Layer -->
  <g class="node-card">
    <rect x="208" y="105" width="304" height="50" rx="10" fill="url(#bg-emerald)" stroke="url(#grad-emerald)" stroke-width="1.5" />
    <text class="tt" x="360" y="123">FastAPI API Layer</text>
    <text class="ts" x="360" y="141">Validate · Route · Dispatch</text>
  </g>

  <!-- Task Manager -->
  <g class="node-card">
    <rect x="235" y="180" width="250" height="50" rx="10" fill="url(#bg-slate)" stroke="url(#grad-slate)" stroke-width="1.25" />
    <text class="tt" x="360" y="198">Task Manager</text>
    <text class="ts" x="360" y="216">Background Task Queue</text>
  </g>

  <!-- Hunter Agent (Left Fork) -->
  <g class="node-card">
    <rect x="52" y="255" width="220" height="60" rx="10" fill="url(#bg-purple)" stroke="url(#grad-purple)" stroke-width="1.5" />
    <text class="tt" x="162" y="277">Hunter Agent</text>
    <text class="ts" x="162" y="297">LangGraph Orchestration</text>
  </g>

  <!-- Tool Wrappers (Right Fork) -->
  <g class="node-card">
    <rect x="448" y="255" width="220" height="60" rx="10" fill="url(#bg-emerald)" stroke="url(#grad-emerald)" stroke-width="1.5" />
    <text class="tt" x="558" y="277">Tool Wrappers</text>
    <text class="ts" x="558" y="297">Subprocess Invocations</text>
  </g>

  <!-- File System -->
  <g class="node-card">
    <rect x="185" y="365" width="350" height="50" rx="10" fill="url(#bg-slate)" stroke="url(#grad-slate)" stroke-width="1.25" />
    <text class="tt" x="360" y="383">File System</text>
    <text class="ts" x="360" y="401">var/scan_results/ · Sessions</text>
  </g>

  <!-- Report Builder -->
  <g class="node-card">
    <rect x="208" y="440" width="304" height="50" rx="10" fill="url(#bg-emerald)" stroke="url(#grad-emerald)" stroke-width="1.5" />
    <text class="tt" x="360" y="458">Report Builder</text>
    <text class="ts" x="360" y="476">Consolidate · Rank · Format</text>
  </g>

  <!-- Client Response -->
  <g class="node-card">
    <rect x="238" y="515" width="244" height="50" rx="10" fill="url(#bg-amber)" stroke="url(#grad-amber)" stroke-width="1.5" />
    <text class="tt" x="360" y="533">Client Response</text>
    <text class="ts" x="360" y="551">JSON · HTML Report · Download</text>
  </g>

  <!-- Arrows -->
  <line x1="360" y1="81"  x2="360" y2="105" class="connector-flow" marker-end="url(#arrow-active)" />
  <line x1="360" y1="155" x2="360" y2="180" class="connector-flow" marker-end="url(#arrow-active)" />
  
  <path d="M360 230 L360 245 L162 245 L162 255" class="connector" marker-end="url(#arrow)" />
  <path d="M360 230 L360 245 L558 245 L558 255" class="connector" marker-end="url(#arrow)" />
  
  <path d="M162 315 L162 345 L360 345 L360 365" class="connector" marker-end="url(#arrow)" />
  <path d="M558 315 L558 345 L360 345 L360 365" class="connector" marker-end="url(#arrow)" />
  
  <line x1="360" y1="415" x2="360" y2="440" class="connector-flow" marker-end="url(#arrow-active)" />
  <line x1="360" y1="490" x2="360" y2="515" class="connector-flow" marker-end="url(#arrow-active)" />
</svg>
